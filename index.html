<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>龙游天海</title>
<meta name="description" content="变成一条龙：火龙翱翔天空，海龙遨游大海。吃东西长大，从幼龙长成成龙。">
<meta property="og:title" content="龙游天海">
<meta property="og:description" content="变成一条龙，在天和海之间来回穿梭，吃东西长大。">
<meta property="og:image" content="https://grrreymane.github.io/DragonSkySea/cover.png">
<meta property="og:url" content="https://grrreymane.github.io/DragonSkySea/">

<style>@font-face { font-family: "ZCOOL QingKe HuangYou"; src: url("fonts/qingke.woff2?v=7d18d08a") format("woff2"); font-display: swap; } @font-face { font-family: "Fusion Pixel"; src: url("fonts/pixel.woff2?v=7d18d08a") format("woff2"); font-display: swap; }</style>

<style>
:root{--title-font:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;--px-font:"Fusion Pixel","PingFang SC","Microsoft YaHei",sans-serif}
html,body{margin:0;height:100%;background:#0b0e1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:var(--px-font)}
#wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100vh * 9 / 16));overflow:hidden;background:#9cc4e4}
#wrap>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);pointer-events:none;display:none;z-index:5}
#joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.75)}
#dbg{position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));color:#fff;font:11px/1.3 ui-monospace,monospace;text-shadow:0 1px 2px #000;pointer-events:none;white-space:pre;z-index:50;display:none}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;font:700 16px/1.4 var(--title-font);background:linear-gradient(#3d78c6,#9cc4e4 60%,#2b8fae);z-index:40;transition:opacity .6s}
#boot b{font-size:40px;letter-spacing:4px;text-shadow:0 3px 0 #1c3a66,0 0 18px rgba(255,255,255,.4)}
#err{position:absolute;left:8px;right:8px;top:40%;color:#fff;background:#a22;padding:10px;border-radius:8px;font:12px/1.4 ui-monospace,monospace;display:none;white-space:pre-wrap;z-index:99;pointer-events:auto}
</style>
<link rel="stylesheet" href="src/ui/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<div id="wrap">
  <div id="ui"></div>
  <div id="joy"><i></i></div>
  <div id="dbg"></div>
  <div id="boot"><b>龙游天海</b><span id="bootMsg">加载中…</span></div>
  <div id="err"></div>
</div>
<script>
// 报错面板：崩溃时屏幕上显示错误，玩家可以截图发回来；8 秒还没启动也提示
(function () {
  var shown = false;
  function show(msg) { var el = document.getElementById('err'); el.style.display = 'block'; el.textContent = (el.textContent ? el.textContent + '\n' : '') + '出错了：' + msg; shown = true; }
  addEventListener('error', function (e) { show(e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '')); });
  addEventListener('unhandledrejection', function (e) { var r = e.reason; show((r && (r.stack || r.message)) || String(r)); });
  setTimeout(function () { if (!window.__booted && !shown) { var m = document.getElementById('bootMsg'); if (m) m.textContent = '网络有点慢，再等等…（或刷新重试）'; } }, 8000);
  try { var c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) show('手机不支持 3D（WebGL）'); } catch (e) {}
})();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
