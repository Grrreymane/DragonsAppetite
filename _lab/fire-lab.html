<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>火山 · 火龙</title>
<style>
html,body{margin:0;height:100%;background:#ece6dc;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#wrap{position:fixed;inset:0}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#title{position:absolute;left:22px;top:calc(16px + env(safe-area-inset-top));font-size:26px;font-weight:800;color:#3a322c;letter-spacing:3px;padding-bottom:8px;border-bottom:2px solid rgba(58,50,44,.4);pointer-events:none}
#ui{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 10px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.seg{display:flex;background:rgba(255,255,255,.62);border-radius:12px;padding:3px;gap:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;box-shadow:0 2px 10px rgba(60,40,20,.08)}
button{border:0;border-radius:9px;padding:9px 13px;font:700 14px/1 inherit;font-family:inherit;background:transparent;color:#3a322c;cursor:pointer}
button.on{background:#b9452f;color:#fff}
#ref{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));width:min(48vw,560px);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none;pointer-events:none}
#ref.show{display:block}
.lab{position:absolute;transform:translate(-50%,0);font-size:17px;font-weight:700;color:#3a322c;letter-spacing:2px;pointer-events:none;white-space:nowrap}
#fps{position:absolute;right:8px;bottom:4px;font:11px ui-monospace,monospace;color:#3a322c;opacity:.4;pointer-events:none}
#err{position:absolute;left:10px;right:10px;top:40%;background:#a22;color:#fff;padding:10px;border-radius:8px;font-size:12px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">火山 · 火龙</div>
  <img id="ref" src="../ref/fire-concept.webp" alt="">
  <div id="labels"></div>
  <div id="ui">
    <div class="seg" data-k="view"><button data-v="0">幼龙</button><button data-v="1">少年龙</button><button data-v="2">成龙</button><button data-v="all">全部</button></div>
    <div class="seg" data-k="pose"><button data-v="0">站立</button><button data-v="1">飞行</button></div>
    <div class="seg" data-k="ref"><button data-v="1">参考图</button></div>
  </div>
  <div id="fps"></div>
  <div id="err"></div>
</div>
<script>
addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = '出错了：' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || ''); });
</script>
<script type="module">
import * as THREE from '../lib/three.module.min.js';
import { createFireDragon, STAGES, nostrilWorld } from './firedragon.js';
import { makeSmokeTex } from './textures.js';

const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
wrap.prepend(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xece6dc);
const camera = new THREE.PerspectiveCamera(30, 1, .1, 300);

scene.add(new THREE.HemisphereLight(0xfff3e4, 0xb59a80, 1.1));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6); sun.position.set(14, 22, 16); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 90 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .03; scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xcfdcff, .55); fill.position.set(-8, 5, -10); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffb27a, 1.1); rim.position.set(-12, 8, 4); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.ShadowMaterial({ opacity: .2 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// 三只龙，像设定图一样从左到右排（屏幕左边 = 龙的前方 +Z）
const ZPOS = [9, 3.4, -5.4], FLY = [3.2, 4.6, 6.2];
const dragons = STAGES.map((st, i) => { const D = createFireDragon(i); D.flyY = FLY[i]; D.root.position.z = ZPOS[i]; scene.add(D.root); return D; });

// 鼻子冒烟
const smokeTex = makeSmokeTex(), puffs = [];
for (let i = 0; i < 40; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0 })); s.visible = false; scene.add(s); puffs.push({ s, life: 0, v: new THREE.Vector3() }); }
let puffI = 0; const _n = new THREE.Vector3();
function puff(D) {
  for (let k = 0; k < 2; k++) {
    const p = puffs[puffI++ % puffs.length]; nostrilWorld(D, k, p.s.position);
    _n.set(0, 0, 1).applyQuaternion(D.head.getWorldQuaternion(new THREE.Quaternion()));
    p.v.copy(_n).multiplyScalar(.25 * D.st.size).add(new THREE.Vector3(0, .55 * D.st.size, 0));
    p.life = 2.6; p.max = 2.6; p.size = D.st.size; p.s.visible = true;
  }
}

// ---------- 状态 / 界面 ----------
const S = { view: innerWidth > innerHeight ? 'all' : '2', pose: '0', ref: '0' };
const cam = { az: 1.32, el: .1, dist: 30, target: new THREE.Vector3(), tDist: 30, tTarget: new THREE.Vector3() };
const labels = dragons.map(D => { const d = document.createElement('div'); d.className = 'lab'; d.textContent = D.st.name; document.getElementById('labels').appendChild(d); return d; });
function frameView() {
  const all = S.view === 'all', fly = S.pose === '1';
  dragons.forEach((D, i) => { const on = all || S.view === String(i); D.root.visible = on; labels[i].style.display = on ? '' : 'none'; D.root.position.z = all ? ZPOS[i] : 0; });
  const vis = dragons.filter(D => D.root.visible);
  const R = all ? 13.5 : [2.6, 4.8, 7.2][+S.view];
  const cy = all ? (fly ? 5.2 : 3.0) : (fly ? FLY[+S.view] + .4 : [1.1, 2.4, 3.7][+S.view]);
  cam.tTarget.set(0, cy, all ? 1.6 : -.6 * vis[0].st.size);
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  cam.tDist = R / Math.sin(Math.min(vf, hf) / 2) * .92;
}
document.querySelectorAll('.seg').forEach(seg => {
  const k = seg.dataset.k;
  const mark = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === S[k]));
  mark();
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S[k] = k === 'ref' ? (S.ref === '1' ? '0' : '1') : b.dataset.v; mark();
    if (k === 'ref') document.getElementById('ref').classList.toggle('show', S.ref === '1');
    else frameView();
  });
});

// 拖动旋转、滚轮 / 双指缩放
const ptrs = new Map(); let pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.tDist; } });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) { cam.az -= (e.clientX - p.x) * .006; cam.el = Math.max(-.05, Math.min(1.1, cam.el + (e.clientY - p.y) * .004)); }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; cam.tDist = dist0 * pinch0 / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)); }
});
const up = e => ptrs.delete(e.pointerId);
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.tDist *= Math.pow(1.0012, e.deltaY); }, { passive: false });

let lw = 0, lh = 0, first = true;
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h || (w === lw && h === lh)) return;
  lw = w; lh = h;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (first) { S.view = w > h ? 'all' : '2'; document.querySelectorAll('.seg[data-k="view"] button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view)); }
  frameView();
  if (first) { cam.dist = cam.tDist; cam.target.copy(cam.tTarget); first = false; }
}
addEventListener('resize', resize);

const fpsEl = document.getElementById('fps'); let fn = 0, ft = 0, last = performance.now(), smokeT = [1.5, .4, 1.1];
const _p = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  resize(); if (first) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  fn++; ft += dt; if (ft > .5) { fpsEl.textContent = Math.round(fn / ft) + ' fps'; fn = ft = 0; }
  const pose = +S.pose;
  dragons.forEach((D, i) => {
    if (!D.root.visible) return;
    D.update(dt, pose);
    if (i > 0 && pose === 0) { smokeT[i] -= dt; if (smokeT[i] < 0) { smokeT[i] = 2.4 + Math.random() * 1.5; puff(D); } }
  });
  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt; if (p.life <= 0) { p.s.visible = false; continue; }
    const a = 1 - p.life / p.max;
    p.s.position.addScaledVector(p.v, dt); p.v.multiplyScalar(Math.exp(-dt * .6));
    p.s.scale.setScalar((.12 + a * .9) * p.size); p.s.material.opacity = .5 * Math.sin(Math.PI * Math.min(1, a * 1.2));
  }
  const k = 1 - Math.exp(-dt * 4);
  cam.dist += (cam.tDist - cam.dist) * k; cam.target.lerp(cam.tTarget, k);
  camera.position.set(cam.target.x + Math.sin(cam.az) * Math.cos(cam.el) * cam.dist, cam.target.y + Math.sin(cam.el) * cam.dist, cam.target.z + Math.cos(cam.az) * Math.cos(cam.el) * cam.dist);
  camera.lookAt(cam.target);
  // 名字标在脚下
  dragons.forEach((D, i) => {
    if (!D.root.visible) return;
    _p.set(0, 0, D.root.position.z - .6 * D.st.size).project(camera);
    labels[i].style.left = ((_p.x + 1) / 2 * wrap.clientWidth) + 'px'; labels[i].style.top = ((1 - _p.y) / 2 * wrap.clientHeight + 14) + 'px';
  });
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.__lab = { dragons, scene, camera, S, cam };
</script>
</body>
</html>
