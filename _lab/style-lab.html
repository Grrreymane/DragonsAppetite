<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>龙 · 风格实验室</title>
<style>
html,body{margin:0;background:#0b0e1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100vh * 9 / 16));overflow:hidden;background:#1a2440}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;left:0;right:0;bottom:0;padding:22px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;background:linear-gradient(rgba(8,10,28,0),rgba(8,10,28,.55) 28%,rgba(8,10,28,.7));pointer-events:none}
.row{display:flex;align-items:center;gap:6px;pointer-events:auto}
.row>b{flex:0 0 34px;color:#fff;font-size:12px;opacity:.8;font-weight:600;text-shadow:0 1px 2px #000}
.seg{flex:1;display:flex;gap:4px}
button{flex:1;border:0;border-radius:9px;padding:9px 0;font:600 14px/1 inherit;font-family:inherit;color:#eef2ff;background:rgba(255,255,255,.14);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer;touch-action:none}
button.on{background:#ffd56b;color:#3b2408}
#breath{flex:0 0 96px;background:#ff7b45;color:#fff;font-size:15px}
#breath.on{background:#ffb347;color:#3b1a08}
#hint{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;transition:opacity .6s}
#fps{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;color:#fff;font:11px/1 ui-monospace,monospace;opacity:.55;pointer-events:none}
#joy{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.7)}
#err{position:absolute;left:8px;right:8px;top:40%;color:#fff;background:#a22;padding:10px;border-radius:8px;font-size:12px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
  <div id="hint">拖动 旋转视角</div>
  <div id="fps"></div>
  <div id="joy"><i></i></div>
  <div id="ui">
    <div class="row"><b>画风</b><div class="seg" data-k="style"><button data-v="lowpoly">低多边形</button><button data-v="toon">卡通描边</button><button data-v="pixel">像素</button></div></div>
    <div class="row"><b>龙种</b><div class="seg" data-k="species"><button data-v="fire">🔥 火龙</button><button data-v="ice">❄️ 冰龙</button><button data-v="storm">⚡ 雷龙</button></div></div>
    <div class="row"><b>成长</b><div class="seg" data-k="stage"><button data-v="0">幼龙</button><button data-v="1">少年</button><button data-v="2">成龙</button></div></div>
    <div class="row"><b>模式</b><div class="seg" data-k="mode"><button data-v="show">展示</button><button data-v="fly">试飞</button></div><button id="breath">按住 喷吐</button></div>
  </div>
  <div id="err"></div>
</div>
<script>
addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = '出错了：' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || ''); });
</script>
<script type="module">
import * as THREE from '../lib/three.module.min.js';

// ---------- 小工具 ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const col = h => new THREE.Color(h);
let seed = 7;
const rnd = () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) + 0x6d2b79f5 | 0) >>> 0) / 4294967296;
const rr = (a, b) => a + (b - a) * rnd();

// 同一个位置永远得到同一个抖动值，所以共用顶点不会裂开
function hash3(x, y, z) {
  let h = (Math.round(x * 997) * 73856093) ^ (Math.round(y * 997) * 19349663) ^ (Math.round(z * 997) * 83492791);
  const r = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return ((h >>> 0) / 4294967295) * 2 - 1; };
  return [r(), r(), r()];
}

// 把几何体变成非索引 + 按面上色（低多边形的关键：每个三角面一个颜色）
const _a = V(), _b = V(), _c = V(), _n = V(), _m = V(), _tc = new THREE.Color();
function prep(geo, colorFn, jit = 0) {
  if (geo.index) geo = geo.toNonIndexed();
  geo.deleteAttribute('uv');
  const pos = geo.attributes.position, n = pos.count;
  if (jit) for (let i = 0; i < n; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), h = hash3(x, y, z);
    pos.setXYZ(i, x + h[0] * jit, y + h[1] * jit, z + h[2] * jit);
  }
  const cols = new Float32Array(n * 3);
  for (let i = 0; i < n; i += 3) {
    _a.fromBufferAttribute(pos, i); _b.fromBufferAttribute(pos, i + 1); _c.fromBufferAttribute(pos, i + 2);
    _m.copy(_a).add(_b).add(_c).multiplyScalar(1 / 3);
    _n.subVectors(_c, _b).cross(_a.clone().sub(_b)).normalize();
    const c = colorFn(_m, _n);
    _tc.copy(c);
    const v = 1 + hash3(_m.x * 3.1, _m.y * 3.1, _m.z * 3.1)[0] * 0.045;
    _tc.multiplyScalar(v);
    for (let k = 0; k < 3; k++) { cols[(i + k) * 3] = _tc.r; cols[(i + k) * 3 + 1] = _tc.g; cols[(i + k) * 3 + 2] = _tc.b; }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  if (!geo.attributes.normal) geo.computeVertexNormals();
  return geo;
}
function merge(geos) {
  let n = 0; for (const g of geos) n += g.attributes.position.count;
  const P = new Float32Array(n * 3), N = new Float32Array(n * 3), C = new Float32Array(n * 3);
  let o = 0;
  for (const g of geos) {
    P.set(g.attributes.position.array, o * 3); N.set(g.attributes.normal.array, o * 3); C.set(g.attributes.color.array, o * 3);
    o += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(P, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(N, 3));
  out.setAttribute('color', new THREE.BufferAttribute(C, 3));
  return out;
}
const ell = (rx, ry, rz, det) => new THREE.IcosahedronGeometry(1, det).scale(rx, ry, rz);
const _up = V(0, 1, 0), _q = new THREE.Quaternion();
// 从 a 到 b 的锥形管（骨头、角、腿）
function tube(a, b, ra, rb, seg) {
  const d = V().subVectors(b, a), len = d.length();
  const g = new THREE.CylinderGeometry(rb, ra, len, seg, 1);
  g.translate(0, len / 2, 0);
  _q.setFromUnitVectors(_up, d.normalize());
  g.applyQuaternion(_q); g.translate(a.x, a.y, a.z);
  return g;
}
const solid = c => () => c;

// ---------- 渲染器 ----------
const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.prepend(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 0.5, 0.5, 2200);

const SKY = { top: col(0x3f7fd0), mid: col(0xa8d4f2), bot: col(0xf6e2c4) };
scene.fog = new THREE.Fog(SKY.mid.clone(), 160, 620);
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: SKY.top }, mid: { value: SKY.mid }, bot: { value: SKY.bot } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top, mid, bot; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = h > 0. ? mix(mid, top, smoothstep(0.0, 0.55, h)) : mix(mid, bot, smoothstep(0.0, -0.25, h));
    gl_FragColor = vec4(c, 1.);
    #include <colorspace_fragment>
    }`
}));
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);

scene.add(new THREE.HemisphereLight(0xd6ecff, 0x41606e, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(-50, 90, 70); scene.add(sun);
const mouthLight = new THREE.PointLight(0xff8a3a, 0, 14, 1.6); scene.add(mouthLight);

// 卡通分层光照的色阶图
function gradTex(vals) {
  const t = new THREE.DataTexture(new Uint8Array(vals), vals.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
}
const GRAD = gradTex([70, 150, 255]);
function skinMat(style, extra = {}) {
  if (style === 'lowpoly') return new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85, metalness: 0, ...extra });
  const m = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: GRAD, ...extra });
  return m;
}
function worldMat(style, extra = {}) {
  if (style === 'lowpoly') return new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0, ...extra });
  const m = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: GRAD, ...extra });
  m.flatShading = true; return m;
}
function hullMat(color, w) {
  const m = new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
  m.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n transformed += normalize(normal) * ${w.toFixed(4)};`); };
  return m;
}

// ---------- 世界：海、岛、云 ----------
const T = { value: 0 };
function addWaves(m) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uT = T;
    sh.vertexShader = 'uniform float uT;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wp = modelMatrix * vec4(transformed, 1.);
      transformed.y += sin(wp.x*0.045 + uT*1.1)*1.3 + sin(wp.z*0.06 - uT*0.85)*1.1 + sin((wp.x+wp.z)*0.1 + uT*1.7)*0.5;`);
  };
  return m;
}
const seaGeo = new THREE.PlaneGeometry(1500, 1500, 75, 75); seaGeo.rotateX(-Math.PI / 2);
const seaMats = {
  lowpoly: addWaves(new THREE.MeshStandardMaterial({ color: 0x2c8fb8, flatShading: true, roughness: 0.55, metalness: 0 })),
  toon: addWaves(Object.assign(new THREE.MeshToonMaterial({ color: 0x3aa2cc, gradientMap: GRAD }), { flatShading: true })),
};
seaMats.pixel = seaMats.toon;
const sea = new THREE.Mesh(seaGeo, seaMats.lowpoly); scene.add(sea);

const PERIOD = 960;            // 世界按这个周期无限重复
const worldObjs = [];          // {mesh, base, kind, prof}
const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff6a1f });
const crystalGlow = new THREE.MeshBasicMaterial({ color: 0xc9a8ff });

// 剖面 [半径, 高度]，从底到顶，用来车削成山
function heightAt(prof, d) {
  if (d >= prof[0][0]) return -99;
  for (let i = 0; i < prof.length - 1; i++) {
    const [r0, h0] = prof[i], [r1, h1] = prof[i + 1];
    if (d <= r0 && d >= r1) return lerp(h0, h1, (r0 - d) / Math.max(1e-4, r0 - r1));
  }
  return prof[prof.length - 1][1];
}
function lathe(prof, seg) { return new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), seg); }
function tree(x, y, z, s, leaf) {
  return [
    prep(tube(V(x, y - 0.5, z), V(x, y + 1.6 * s, z), 0.35 * s, 0.25 * s, 5), solid(col(0x6b4a32))),
    prep(new THREE.ConeGeometry(1.5 * s, 3.6 * s, 6).translate(x, y + 3 * s, z), solid(leaf), 0.12 * s),
  ];
}
function makeIsland(kind, r, h) {
  const geos = []; let prof, extra = null, fy = 0;
  const C = {
    sand: col(0xe8d39a), grass: col(0x6fb25a), grass2: col(0x8cc65e), rock: col(0x8c8378), rockD: col(0x6a625c),
    snow: col(0xf3f8ff), ice: col(0xbfe3f5), ash: col(0x4a3d3a), ashL: col(0x6e5a52), purple: col(0x7a68b8),
  };
  if (kind === 'green') {
    prof = [[r * 1.1, -6], [r, 0.6], [r * 0.85, 2], [r * 0.6, h * 0.45], [r * 0.3, h * 0.85], [0.01, h]];
    geos.push(prep(lathe(prof, 12), (m, n) => m.y < 1.6 ? C.sand : n.y < 0.55 ? C.rock : m.y > h * 0.6 ? C.grass2 : C.grass, r * 0.06));
    for (let i = 0; i < 7; i++) { const a = rr(0, 6.28), d = rr(r * 0.25, r * 0.75); geos.push(...tree(Math.cos(a) * d, heightAt(prof, d), Math.sin(a) * d, rr(1.1, 1.8), C.grass.clone().multiplyScalar(0.75))); }
  } else if (kind === 'volcano') {
    prof = [[r * 1.1, -6], [r, 0.6], [r * 0.8, h * 0.2], [r * 0.5, h * 0.6], [r * 0.24, h], [r * 0.17, h * 0.9], [0.01, h * 0.8]];
    geos.push(prep(lathe(prof, 13), (m, n) => m.y < 1.6 ? C.ash : m.y > h * 0.78 ? C.rockD : n.y < 0.5 ? C.ashL : C.ash.clone().lerp(C.rock, 0.3), r * 0.05));
    extra = new THREE.Mesh(new THREE.CircleGeometry(r * 0.2, 9).rotateX(-Math.PI / 2).translate(0, h * 0.84, 0), lavaMat);
  } else if (kind === 'snow') {
    prof = [[r * 1.1, -6], [r, 0.6], [r * 0.75, h * 0.25], [r * 0.45, h * 0.55], [r * 0.2, h * 0.85], [0.01, h]];
    geos.push(prep(lathe(prof, 11), (m, n) => m.y < 1.6 ? C.ice : m.y > h * 0.42 || n.y > 0.8 ? C.snow : C.rock.clone().lerp(C.ice, 0.25), r * 0.06));
    for (let i = 0; i < 6; i++) {
      const a = rr(0, 6.28), d = rr(r * 0.3, r * 0.8), y = heightAt(prof, d), s = rr(2, 4);
      geos.push(prep(new THREE.OctahedronGeometry(1, 0).scale(s * 0.4, s * 1.6, s * 0.4).rotateZ(rr(-0.3, 0.3)).translate(Math.cos(a) * d, y + s, Math.sin(a) * d), solid(col(0xd7f4ff))));
    }
  } else { // 浮空岛
    prof = [[0.01, -h], [r * 0.4, -h * 0.55], [r * 0.85, -h * 0.15], [r, 0], [r * 0.9, 1.2], [0.01, 1.4]];
    geos.push(prep(lathe(prof, 11), (m, n) => n.y > 0.6 ? C.grass : m.y > -1 ? C.grass.clone().multiplyScalar(0.8) : C.rock.clone().lerp(C.purple, 0.35), r * 0.07));
    for (let i = 0; i < 4; i++) { const a = rr(0, 6.28), d = rr(0, r * 0.6); geos.push(...tree(Math.cos(a) * d, 1.3, Math.sin(a) * d, rr(0.9, 1.4), C.grass2)); }
    extra = new THREE.Group();
    for (let i = 0; i < 3; i++) {
      const a = rr(0, 6.28), d = rr(r * 0.3, r * 0.75), s = rr(1.6, 3);
      const m = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0).scale(s * 0.45, s * 1.5, s * 0.45), crystalGlow);
      m.position.set(Math.cos(a) * d, 1.3 + s, Math.sin(a) * d); m.rotation.z = rr(-0.3, 0.3); extra.add(m);
    }
    fy = rr(55, 95);
  }
  const g = new THREE.Group();
  const mesh = new THREE.Mesh(merge(geos), worldMat('lowpoly')); mesh.userData.world = true; g.add(mesh);
  if (extra) g.add(extra);
  return { g, prof: kind === 'float' ? null : prof, fy };
}
function makeCloud() {
  const geos = [], n = 3 + (rnd() * 3 | 0), w = rr(10, 20);
  for (let i = 0; i < n; i++) {
    const s = rr(0.5, 1) * w * 0.45;
    geos.push(prep(ell(s * 1.3, s * 0.7, s, 1).translate(rr(-w, w) * 0.6, rr(0, s * 0.3), rr(-w, w) * 0.3), (m, nr) => nr.y < -0.3 ? col(0xc9d8ea) : col(0xffffff), s * 0.08));
  }
  const mesh = new THREE.Mesh(merge(geos), worldMat('lowpoly', { emissive: 0x4a5a6a })); mesh.userData.world = true;
  return mesh;
}
function place(kind, x, z, r, h) {
  const isl = makeIsland(kind, r, h);
  const base = V(x, isl.fy, z); isl.g.position.copy(base); scene.add(isl.g);
  worldObjs.push({ obj: isl.g, base, prof: isl.prof, bob: kind === 'float' ? rr(0, 6) : null });
}
// 主角身边的几座“招牌岛”，然后随机撒满一个周期
place('volcano', 70, 110, 42, 48); place('snow', -120, 40, 38, 70); place('float', 30, -95, 22, 26);
place('green', -40, -170, 30, 16); place('green', 170, -30, 26, 12);
const kinds = ['green', 'green', 'volcano', 'snow', 'float', 'float', 'green', 'snow', 'volcano', 'float', 'green', 'float'];
for (const k of kinds) {
  const x = rr(-PERIOD / 2, PERIOD / 2), z = rr(-PERIOD / 2, PERIOD / 2);
  if (Math.hypot(x, z) < 200) continue;
  place(k, x, z, k === 'float' ? rr(16, 26) : rr(24, 44), k === 'snow' ? rr(50, 80) : k === 'volcano' ? rr(35, 55) : k === 'float' ? rr(18, 30) : rr(10, 18));
}
for (let i = 0; i < 26; i++) {
  const c = makeCloud(), base = V(rr(-PERIOD / 2, PERIOD / 2), rr(28, 110), rr(-PERIOD / 2, PERIOD / 2));
  c.position.copy(base); scene.add(c); worldObjs.push({ obj: c, base, drift: rr(1, 3) });
}

// ---------- 龙 ----------
const SPECIES = {
  fire:  { body: 0xc8432f, back: 0x8f2a22, belly: 0xf3b562, wing: 0xe36b3c, bone: 0x7a2219, horn: 0x3b2b2a, eye: 0xffd84a, spike: 0x3b2b2a, glow: 0xff8a3a, tip: 'spade', horns: 'sweep' },
  ice:   { body: 0x86c4ea, back: 0x5b98cc, belly: 0xeef8ff, wing: 0xbfe6ff, bone: 0x4a7fb3, horn: 0xe6fbff, eye: 0x6ff3ff, spike: 0xd6f6ff, glow: 0x9feaff, tip: 'crystal', horns: 'crown' },
  storm: { body: 0x4d4096, back: 0x2f2768, belly: 0xb9a9ff, wing: 0x6f5bd6, bone: 0x241c58, horn: 0xffe14a, eye: 0xfff27a, spike: 0xffe14a, glow: 0xfff0a0, tip: 'fork', horns: 'bolt' },
};

function buildDragon(spKey, stage, style) {
  const S = SPECIES[spKey], g = stage / 2;
  const P = {
    size: [0.6, 0.86, 1.12][stage], head: lerp(1.45, 1, g), eye: lerp(1.6, 1, g),
    neckN: [3, 4, 5][stage], neckL: lerp(0.36, 0.5, g), tailN: [6, 8, 10][stage], tailL: lerp(0.42, 0.54, g),
    wing: lerp(0.62, 1.25, g), horn: lerp(0.32, 1.1, g), chub: lerp(1.2, 1, g), spike: lerp(0.35, 1, g),
  };
  const smooth = style !== 'lowpoly';
  const DET = smooth ? 2 : 1, RS = smooth ? 10 : 5, J = smooth ? 0 : 1;
  const Cb = col(S.body), Ck = col(S.back), Cy = col(S.belly), Ch = col(S.horn), Cs = col(S.spike), Cw = col(S.wing), Co = col(S.bone);
  const skinC = (m, n) => n.y < -0.38 ? Cy : n.y > 0.55 ? Ck : Cb;
  const mSkin = skinMat(style), mWing = skinMat(style, { side: THREE.DoubleSide, emissive: col(S.wing).multiplyScalar(0.18) });
  const mEye = new THREE.MeshBasicMaterial({ color: S.eye });
  const mDark = new THREE.MeshBasicMaterial({ color: 0x140c10 });
  const hull = style === 'toon' ? hullMat(new THREE.Color(S.back).multiplyScalar(0.22), 0.05) : null;
  const add = (parent, geo, mat = mSkin, outline = true) => {
    const m = new THREE.Mesh(geo, mat); parent.add(m);
    if (hull && outline) m.add(new THREE.Mesh(geo, hull));
    return m;
  };
  const spike = (x, y, z, s, tilt = -0.6) => S.horns === 'crown'
    ? prep(new THREE.OctahedronGeometry(1, 0).scale(0.07 * s, 0.24 * s, 0.07 * s).rotateX(tilt).translate(x, y + 0.12 * s, z), solid(Cs))
    : prep(new THREE.ConeGeometry(0.08 * s, 0.26 * s, smooth ? 8 : 4).rotateX(tilt).translate(x, y + 0.1 * s, z), solid(Cs), 0);

  const H = PX_H, W = Math.round(H * w / h);
  if (pxRT && W === pxW && H === pxH) return;
  if (pxRT) { pxRT.depthTexture.dispose(); pxRT.dispose(); }
  pxW = W; pxH = H;
  pxRT = new THREE.WebGLRenderTarget(W, H, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthTexture: new THREE.DepthTexture(W, H) });
  blitMat.uniforms.tCol.value = pxRT.texture; blitMat.uniforms.tDep.value = pxRT.depthTexture; blitMat.uniforms.res.value.set(W, H);
}

// ---------- 状态 / 界面 ----------
const S = { style: 'lowpoly', species: 'fire', stage: '1', mode: 'show' };
let D = null, pop = 1;
const homePos = V(0, 34, 0);
const fl = { pos: homePos.clone(), yaw: 0, pitch: 0, bank: 0, speed: 22, yawRate: 0, flapT: 2, flapping: true };
const cam = { yaw: 0.75, pitch: 0.12, dist: 14, idle: 0 };

function rebuild(evolve) {
  const old = D;
  D = buildDragon(S.species, +S.stage, S.style);
  if (old) { D.root.position.copy(old.root.position); D.root.rotation.copy(old.root.rotation); D.phase = old.phase; scene.remove(old.root); }
  else D.root.position.copy(homePos);
  scene.add(D.root);
  mouthLight.color.set(D.S.glow);
  if (evolve) { pop = 0; evolvePuff(D); }
}
function applyStyle() {
  const m = worldMat(S.style), mc = worldMat(S.style, { emissive: 0x4a5a6a });
  scene.traverse(o => { if (o.userData.world) o.material = o.material.emissive && o.material.emissive.getHex() ? mc : m; });
  sea.material = seaMats[S.style];
  renderer.setPixelRatio(S.style === 'pixel' ? 1 : Math.min(devicePixelRatio, 2));
  resize();
}
document.querySelectorAll('.seg').forEach(seg => {
  const k = seg.dataset.k;
  const mark = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === S[k]));
  mark();
  seg.addEventListener('pointerdown', e => {
    const b = e.target.closest('button'); if (!b || S[k] === b.dataset.v) return;
    const prev = S[k]; S[k] = b.dataset.v; mark();
    if (k === 'style') { applyStyle(); rebuild(false); }
    if (k === 'species') rebuild(true);
    if (k === 'stage') rebuild(true);
    if (k === 'mode') {
      hint.style.opacity = 1; hint.textContent = S.mode === 'fly' ? '按住屏幕拖动 控制方向' : '拖动 旋转视角'; hintT = 4;
      if (S.mode === 'fly') { fl.pos.copy(D.root.position); fl.yaw = 0; fl.pitch = 0; fl.flapT = 2; fl.flapping = true; }
    }
  });
});
const hint = document.getElementById('hint'); let hintT = 5;
const breathBtn = document.getElementById('breath'); let breathing = false;
const setBreath = v => { breathing = v; breathBtn.classList.toggle('on', v); };
breathBtn.addEventListener('pointerdown', e => { e.preventDefault(); breathBtn.setPointerCapture(e.pointerId); setBreath(true); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) breathBtn.addEventListener(ev, () => setBreath(false));
addEventListener('contextmenu', e => e.preventDefault());

// 拖动：展示模式转视角，试飞模式是摇杆
const joy = document.getElementById('joy'), knob = joy.firstElementChild;
let ptr = null; const stick = { x: 0, y: 0 };
canvas.addEventListener('pointerdown', e => {
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY };
  canvas.setPointerCapture(e.pointerId); cam.idle = 0;
  if (S.mode === 'fly') { const r = wrap.getBoundingClientRect(); joy.style.display = 'block'; joy.style.left = (e.clientX - r.left) + 'px'; joy.style.top = (e.clientY - r.top) + 'px'; }
});
canvas.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (S.mode === 'show') {
    cam.yaw -= (e.clientX - ptr.lx) * 0.009; cam.pitch = clamp(cam.pitch + (e.clientY - ptr.ly) * 0.006, -0.5, 1.1);
  } else {
    const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0, R = 46, l = Math.hypot(dx, dy), k = l > R ? R / l : 1;
    stick.x = dx * k / R; stick.y = dy * k / R;
    knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
  }
  ptr.lx = e.clientX; ptr.ly = e.clientY;
  if (hintT > 0.6) hintT = 0.6;
});
const endPtr = e => { if (ptr && e.pointerId === ptr.id) { ptr = null; stick.x = stick.y = 0; joy.style.display = 'none'; knob.style.transform = ''; } };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
// 电脑上也能用方向键 / 空格
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') setBreath(true); });
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') setBreath(false); });

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  sizePixelRT(w, h);
}
addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

// ---------- 主循环 ----------
const fpsEl = document.getElementById('fps'); let fpsN = 0, fpsT = 0;
let last = performance.now();
const _f = V(), _camTarget = V(), _look = V();
// 竖屏时横向视野很窄：按横向视角算镜头距离，保证翅膀不出框
const hTan = fov => Math.tan(fov * Math.PI / 360) * Math.min(1, camera.aspect);
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  T.value += dt;
  fpsN++; fpsT += dt; if (fpsT > 0.5) { fpsEl.textContent = Math.round(fpsN / fpsT) + ' fps'; fpsN = 0; fpsT = 0; }
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) hint.style.opacity = 0; }

  const tgt = { amp: 0.8, freq: 1.25, fold: 0, sweep: 0, dihedral: 0.12, breath: breathing ? 1 : 0, turn: 0, lookY: 0, lookX: 0 };
  const vel = V();
  if (S.mode === 'show') {
    D.root.position.lerp(homePos, damp(1.5, dt));
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, 0));
    D.root.quaternion.slerp(q, damp(3, dt));
    // 头稍微看向镜头
    const toCam = camera.position.clone().sub(D.root.position);
    tgt.lookY = clamp(Math.atan2(toCam.x, toCam.z), -0.9, 0.9) * 0.7;
    tgt.lookX = clamp(-toCam.y / Math.max(1, toCam.length()), -0.4, 0.4);
    if (breathing) tgt.lookY *= 0.3;
  } else {
    const jx = clamp(stick.x + (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), -1, 1);
    const jy = clamp(stick.y + (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0), -1, 1);
    fl.yawRate = lerp(fl.yawRate, -jx * 1.15, damp(4, dt));
    fl.yaw += fl.yawRate * dt;
    let pt = -jy * 0.65;
    if (fl.pos.y < 10 && pt < 0.15) pt = 0.3;
    if (fl.pos.y > 190 && pt > 0) pt = -0.2;
    fl.pitch = lerp(fl.pitch, pt, damp(2.5, dt));
    fl.bank = lerp(fl.bank, -fl.yawRate * 0.55, damp(3, dt));
    const diving = fl.pitch < -0.28, climbing = fl.pitch > 0.15;
    fl.speed = lerp(fl.speed, diving ? 42 : climbing ? 17 : 24, damp(1.2, dt));
    _f.set(Math.sin(fl.yaw) * Math.cos(fl.pitch), Math.sin(fl.pitch), Math.cos(fl.yaw) * Math.cos(fl.pitch));
    vel.copy(_f).multiplyScalar(fl.speed);
    fl.pos.addScaledVector(vel, dt * D.P.size * 1.1);
    // 别穿山
    for (const w of worldObjs) if (w.prof) {
      const h = heightAt(w.prof, Math.hypot(fl.pos.x - w.obj.position.x, fl.pos.z - w.obj.position.z));
      if (fl.pos.y < h + 4) fl.pos.y = lerp(fl.pos.y, h + 4, damp(8, dt));
    }
    fl.pos.y = Math.max(fl.pos.y, 5);
    D.root.position.copy(fl.pos);
    D.root.rotation.set(-fl.pitch, fl.yaw, fl.bank, 'YXZ');
    fl.flapT -= dt; if (fl.flapT < 0) { fl.flapping = !fl.flapping; fl.flapT = fl.flapping ? 2.4 : 1.8; }
    if (diving) Object.assign(tgt, { amp: 0.06, freq: 0.8, fold: 1.25, sweep: 0.55, dihedral: 0.05 });
    else if (climbing || fl.flapping) Object.assign(tgt, { amp: climbing ? 0.9 : 0.75, freq: climbing ? 1.7 : 1.35, dihedral: 0.1 });
    else Object.assign(tgt, { amp: 0.05, freq: 0.5, fold: 0.08, sweep: 0.06, dihedral: 0.2 });
    tgt.turn = fl.yawRate; tgt.lookY = fl.yawRate * 0.35; tgt.lookX = -fl.pitch * 0.4;
  }
  animateDragon(D, dt, tgt);
  if (pop < 1) { pop = Math.min(1, pop + dt * 1.6); const e = 1 + 2.2 * Math.pow(pop - 1, 3) + 1.2 * Math.pow(pop - 1, 2); D.root.scale.setScalar(D.P.size * lerp(0.6, 1, e)); }
  mouthLight.intensity = lerp(mouthLight.intensity, breathing ? 40 * D.P.size : 0, damp(10, dt));
  if (breathing) breathe(D, dt, vel.multiplyScalar(D.P.size * 0.9)); else boltT = 0;
  updateParticles(dt);

  // 镜头
  if (S.mode === 'show') {
    cam.idle += dt; if (!ptr && cam.idle > 2.5) cam.yaw += dt * 0.18;
    cam.dist = lerp(cam.dist, Math.max(D.span, D.len) * 0.34 / hTan(58) + 2, damp(3, dt));
    const c = D.root.position;
    _camTarget.set(c.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, c.y + Math.sin(cam.pitch) * cam.dist, c.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
    camera.position.lerp(_camTarget, damp(5, dt));
    _look.lerp(V(c.x, c.y + 0.3 * D.P.size, c.z), damp(6, dt));
  } else {
    const back = V(Math.sin(fl.yaw), 0, Math.cos(fl.yaw)), dist = D.span * 0.5 / hTan(66) + 3;
    _camTarget.copy(fl.pos).addScaledVector(back, -dist).add(V(0, dist * 0.32 - fl.pitch * dist * 0.35, 0));
    camera.position.lerp(_camTarget, damp(3.5, dt));
    _look.lerp(fl.pos.clone().addScaledVector(_f, dist * 0.35).add(V(0, D.span * 0.08, 0)), damp(6, dt));
    camera.fov = lerp(camera.fov, 66 + (fl.speed - 24) * 0.3, damp(2, dt)); camera.updateProjectionMatrix();
  }
  if (S.mode === 'show' && Math.abs(camera.fov - 58) > 0.05) { camera.fov = lerp(camera.fov, 58, damp(3, dt)); camera.updateProjectionMatrix(); }
  camera.lookAt(_look);
  sky.position.copy(camera.position);

  // 世界无限重复 + 浮岛和云慢慢动
  const f = D.root.position;
  sea.position.set(Math.round(f.x / 20) * 20, 0, Math.round(f.z / 20) * 20);
  for (const w of worldObjs) {
    if (w.drift) w.base.x += w.drift * dt;
    w.obj.position.x = w.base.x + PERIOD * Math.round((f.x - w.base.x) / PERIOD);
    w.obj.position.z = w.base.z + PERIOD * Math.round((f.z - w.base.z) / PERIOD);
    w.obj.position.y = w.base.y + (w.bob != null ? Math.sin(T.value * 0.5 + w.bob) * 1.5 : 0);
  }
  lavaMat.color.setHSL(0.05, 1, 0.5 + 0.06 * Math.sin(T.value * 2));

  if (S.style === 'pixel') {
    blitMat.uniforms.cn.value = camera.near; blitMat.uniforms.cf.value = camera.far;
    renderer.setRenderTarget(pxRT); renderer.render(scene, camera);
    renderer.setRenderTarget(null); renderer.render(blitScene, blitCam);
  } else renderer.render(scene, camera);
}
resize();
rebuild(false);
camera.position.set(Math.sin(cam.yaw) * 16, 40, Math.cos(cam.yaw) * 16); _look.copy(homePos);
requestAnimationFrame(frame);
window.__lab = { S, get D() { return D; }, scene, camera, renderer };
</script>
</body>
</html>
